site_name: Partner API Documentation
site_description: Vendors API & Logistics API reference documentation
docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/img/logo-mark.png
  favicon: assets/img/logo-mark.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Vendors API:
      - Overview & Authentication: vendors/overview.md
      - Menu Management: vendors/menu.md
      - Availability & Timing: vendors/availability.md
      - Orders & Webhooks: vendors/orders.md
      - Categories: vendors/categories.md
      - Products: vendors/products.md
      - Promotions & Inventory: vendors/promotions.md
      - Order Status Updates: vendors/order-status.md
  - Logistics API:
      - Add Order: logistics/add-order.md
      - Overview & Authentication: logistics/overview.md
      - Cancel Order: logistics/cancel-order.md
      - Return Order: logistics/return-order.md
      - Get Order Status: logistics/order-status.md
      - Error Handling: logistics/errors.md
      - Change Status Webhook: logistics/webhook-status.md
      - Driver Location Webhook: logistics/webhook-driver-location.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - toc:
      permalink: true
      title: On this page
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css
